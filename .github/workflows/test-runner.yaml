---
name: "Test Runner"

"on":
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test-cli:
    name: "CLI-only install"
    runs-on: ubuntu-latest
    container:
      image: kalilinux/kali-rolling
    timeout-minutes: 60

    steps:
      - name: Prepare container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git gnupg lsb-release sudo
          useradd -m -s /bin/bash ci
          echo 'ci ALL=(ALL) NOPASSWD:ALL' >/etc/sudoers.d/ci
          chmod 440 /etc/sudoers.d/ci

      - name: Checkout repository
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Make scripts executable
        run: |
          find src/scripts -name '*.sh' -exec chmod +x {} +
          find scripts -name '*.sh' -exec chmod +x {} +
          chown -R ci:ci "$GITHUB_WORKSPACE"

      - name: Run CLI-only install
        run: |
          su - ci -c \
            "cd '${GITHUB_WORKSPACE}/src/scripts' && bash run-install.sh cli"

      - name: Validate CLI installs
        run: |
          su - ci -c \
            "cd '$GITHUB_WORKSPACE' && ./scripts/validate-installs-cli.sh"

  test-config:
    name: "Configuration run"
    runs-on: ubuntu-latest
    container:
      image: kalilinux/kali-rolling
    timeout-minutes: 30

    steps:
      - name: Prepare container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git gnupg lsb-release sudo
          useradd -m -s /bin/bash ci
          echo 'ci ALL=(ALL) NOPASSWD:ALL' >/etc/sudoers.d/ci
          chmod 440 /etc/sudoers.d/ci

      - name: Checkout repository
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Make scripts executable
        run: |
          find src/scripts -name '*.sh' -exec chmod +x {} +
          find scripts -name '*.sh' -exec chmod +x {} +
          chown -R ci:ci "$GITHUB_WORKSPACE"

      - name: Run configuration
        run: |
          su - ci -c \
            "cd '${GITHUB_WORKSPACE}/src/scripts' && bash run-config.sh"

      - name: Validate config-only outcomes
        run: |
          su - ci -c \
            "cd '$GITHUB_WORKSPACE' && ./scripts/validate-config-only.sh"

  test-full:
    name: "Full install"
    runs-on: ubuntu-latest
    container:
      image: kalilinux/kali-rolling
    timeout-minutes: 60

    steps:
      - name: Prepare container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git gnupg lsb-release sudo
          useradd -m -s /bin/bash ci
          echo 'ci ALL=(ALL) NOPASSWD:ALL' >/etc/sudoers.d/ci
          chmod 440 /etc/sudoers.d/ci

      - name: Checkout repository
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Make scripts executable
        run: |
          find src/scripts -name '*.sh' -exec chmod +x {} +
          find scripts -name '*.sh' -exec chmod +x {} +
          chown -R ci:ci "$GITHUB_WORKSPACE"

      - name: Run full install
        run: |
          su - ci -c \
            "cd '${GITHUB_WORKSPACE}/src/scripts' && bash run-install.sh all"

      - name: Validate full installs
        run: |
          su - ci -c \
            "cd '$GITHUB_WORKSPACE' && ./scripts/validate-installs.sh"

  test-master:
    name: "Master (install + config)"
    runs-on: ubuntu-latest
    container:
      image: kalilinux/kali-rolling
    timeout-minutes: 60

    steps:
      - name: Prepare container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git gnupg lsb-release sudo
          useradd -m -s /bin/bash ci
          echo 'ci ALL=(ALL) NOPASSWD:ALL' >/etc/sudoers.d/ci
          chmod 440 /etc/sudoers.d/ci

      - name: Checkout repository
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Make scripts executable
        run: |
          find src/scripts -name '*.sh' -exec chmod +x {} +
          find scripts -name '*.sh' -exec chmod +x {} +
          chown -R ci:ci "$GITHUB_WORKSPACE"

      - name: Run setup scripts
        run: |
          su - ci -c \
            "cd '${GITHUB_WORKSPACE}/src/scripts' && bash master.sh"

      - name: Validate installs and config
        run: |
          su - ci -c \
            "cd '$GITHUB_WORKSPACE' && ./scripts/validate.sh"
